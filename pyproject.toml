[project]
name = "platesprice-data"
version = "0.1.0"
description = "Small, cautious collector of reviewed gym plate offers."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.11,<3",
  "protego>=0.4,<0.6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

name: Publish website
on:
  push:
    branches: [master]
    paths: ["data/latest.json"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-website
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'MiKatre/platesprice-data' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.17"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Rebuild website with the validated data commit
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: uv run --locked python -m scripts.trigger_build

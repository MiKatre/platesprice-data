name: Collect plate prices
on:
  # Schedule paused: first GitHub-hosted collection received HTTP 429.
  # After an approved access route is verified, restore: 37 2,8,14,20 * * *
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collect-prices
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'MiKatre/platesprice-data' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      outcome: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.17"
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff check . && uv run --locked pytest -q
      - name: Collect reviewed offers
        id: collect
        continue-on-error: true
        run: uv run --locked python -m plates.collect
      - name: Preserve snapshot and run report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collection
          path: |
            data/latest.json
            runs/report.json
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: collection
          path: collected
      - name: Publish snapshot from unchanged catalog/code
        env:
          COLLECTED_COMMIT: ${{ github.sha }}
        run: |
          # Refuse stale results if a human changed the catalog/code mid-run.
          test "$(git rev-parse HEAD)" = "$COLLECTED_COMMIT"
          test -f collected/runs/report.json
          mkdir -p data
          cp collected/data/latest.json data/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh reviewed plate offers"
            git push origin HEAD:master
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("collected/runs/report.json"))
          print(f"## Plate collection\n{r['ok']}/{r['attempted']} sources OK; {r['offers']} fresh offers.")
          print(f"{r.get('reviewed_offers', 0)} reviewed observations retained with original dates.")
          if r["failed"]:
              print("Needs attention: " + ", ".join(r["failed"]))
          print("Shipping remains unknown. Retained offers keep their original timestamps.")
          PY
      - name: Signal degraded collection after publishing partial progress
        if: needs.collect.outputs.outcome == 'failure'
        run: exit 1

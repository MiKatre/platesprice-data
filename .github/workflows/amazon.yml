name: Amazon prices
on:
  # Daily Amazon.es and Amazon.com prices through Cloudflare Kitesurf, published to the website.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amazon-prices
  cancel-in-progress: false
jobs:
  amazon:
    if: github.repository == 'MiKatre/platesprice-data' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.17"
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: npm ci --prefix kitesurf --ignore-scripts
      # Each product page is priced for the market's own postcode (Madrid 28001 / New York 10001);
      # pages Amazon still prices for elsewhere are counted as wrong_location and dropped.
      - name: Collect Amazon prices
        id: collect
        continue-on-error: true
        timeout-minutes: 40
        env:
          KITESURF_ACCOUNT_ID: ${{ secrets.KITESURF_ACCOUNT_ID }}
          KITESURF_API_TOKEN: ${{ secrets.KITESURF_API_TOKEN }}
        run: uv run --locked python -m plates.amazon --publish
      - name: Validate published snapshot
        run: uv run --locked python -m scripts.trigger_build --validate-only data/latest.json
      - name: Commit and publish
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- amazon/latest.json amazon/trial.jsonl data/latest.json
          if git diff --cached --quiet -- data/latest.json; then echo "changed=false" >> "$GITHUB_OUTPUT"
          else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(amazon): refresh Amazon prices"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          print("## Amazon prices")
          for line in open("amazon/trial.jsonl").read().splitlines()[-2:]:
              r = json.loads(line)
              print(f"- {r['market']} (delivers to {r.get('deliver_to')}): {r['loaded']}/{r['products']} pages, "
                    f"{r['captcha']} captcha, {r['wrong_location']} wrong location, {r['offers']} offers, "
                    f"{r['per_kg']} per kg, {len(r['errors'])} errors")
          PY
      # GITHUB_TOKEN pushes do not trigger the Publish website workflow.
      - name: Rebuild website with the new data commit
        if: steps.commit.outputs.changed == 'true'
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: uv run --locked python -m scripts.trigger_build
      - name: Signal degraded collection after publishing retained offers
        if: steps.collect.outcome == 'failure'
        run: exit 1
